server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # A fresh document must reference the current build after a deployment.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Missing versioned chunks are failures, never the SPA's HTML fallback.
  location /assets/ {
    try_files $uri =404;
  }

  # nginx's stock mime.types has no .mjs; served as octet-stream, the browser
  # refuses the PDF.js worker module and "Fill out a document" cannot load.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
