<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eminence HRIS Schema</title>
<style>
body{margin:0;padding:24px;background:#fff;font:11px/1.35 Arial,Helvetica,sans-serif;color:#222}
.note{display:inline-block;border:1px solid #e6d98a;background:#fffbe0;padding:6px 10px;margin-bottom:18px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.grp{border:1px solid rgba(0,0,0,.12);padding:0 14px 16px;position:relative}
.grp>h2{margin:0 -14px 12px;font:normal 10px Arial;color:#333;background:rgba(0,0,0,.08);width:110px;padding:3px 6px}
.tables{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px}
.t{width:200px;background:#fff;border:1px solid #7f9cc0;border-radius:6px;box-shadow:2px 3px 4px rgba(0,0,0,.25);overflow:hidden}
.t h3{margin:0;padding:4px 6px;font:bold 11px Arial;color:#123;background:linear-gradient(#b7cfe9,#8fb0d6);display:flex;align-items:center;gap:5px}
.t h3:before{content:"";width:10px;height:9px;border:1px solid #456;background:#eef4fb}
.t h3:after{content:"▼";margin-left:auto;font-size:8px;color:#345}
.t ul{list-style:none;margin:0;padding:3px 0}
.t li{padding:1px 6px 1px 20px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t li:before{content:"";position:absolute;left:7px;top:5px;width:6px;height:6px;transform:rotate(45deg);background:#9fc3e6;border:1px solid #5d8bb8}
.t li.pk:before{content:"🔑";transform:none;background:none;border:0;top:0;left:4px;font-size:9px}
.t li.fk:before{background:#e87b7b;border-color:#a33}
.t li.nn:before{background:#4f8fd0}
.t li span{color:#555}
.t .ix{background:linear-gradient(#cfd6de,#b4bec9);color:#fff;padding:2px 6px;font-size:10px;display:flex}
.t .ix:after{content:"▶";margin-left:auto;color:#667;font-size:8px}
.g1{background:#c9eab8}.g2{background:#fdf0c4}.g3{background:#cdf4f8}.g4{background:#f5cdf8}.g5{background:#ebcfc7}.g6{background:#d6e4fb}
.legend{margin-top:22px;display:flex;gap:18px;color:#444}
.legend i{display:inline-block;width:7px;height:7px;transform:rotate(45deg);margin-right:5px;border:1px solid}
</style></head><body>
