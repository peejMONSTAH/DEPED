name: eminence_hris_mobile
description: "Eminence HRIS Mobile App for Teaching & Non-Teaching Personnel"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & HTTP
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Components & Icons
  google_fonts: ^6.1.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3

  # File Picker & Document Viewer
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  lucide_icons_flutter: ^3.1.15
  google_mlkit_document_scanner: ^0.6.1
  pdfx: ^2.11.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Self-hosted copies of the Google Fonts families used across the app. With
    # these bundled and runtime fetching disabled in main.dart, the app never
    # calls fonts.gstatic.com, so typography survives an offline or filtered
    # network. Files are the exact TTFs the google_fonts package would have
    # downloaded, verified against its own SHA-256 manifest.
    - google_fonts/

# Launcher icon generation. The source is the Koronadal City Division seal.
# Regenerate after changing it with:  dart run flutter_launcher_icons
#
# adaptive_icon_foreground_inset keeps the artwork inside the Android 8+ safe
# zone. The system masks the foreground into a circle, squircle or rounded
# square depending on the launcher, clipping anything near the edge. The seal
# is a full-bleed circle, so without an inset its outer ring and lettering
# would be cut off on most phones.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/division-seal.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/division-seal.png"
  adaptive_icon_foreground_inset: 18
